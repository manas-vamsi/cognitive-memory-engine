# Services appear here alongside the connector that uses them, never before.
# Qdrant is here because `QdrantIndex` opens a socket to it. Memgraph and
# PostgreSQL are still absent: the graph is in-memory and the registry is
# SQLite, so declaring them would be config that rots and a `compose up` that
# fails for reasons unrelated to CME.
#
# Qdrant is opt-in — `docker compose --profile vector up` — because CME's
# default retrieval needs no server at all.

services:
  cme:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    environment:
      CME_DATABASE: /data/cme.sqlite
      CME_SOLVER: annealing
    volumes:
      - cme-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  qdrant:
    profiles: ["vector"]
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    restart: unless-stopped

volumes:
  cme-data:
  qdrant-data:
