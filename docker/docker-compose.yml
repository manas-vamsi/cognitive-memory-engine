# Services appear here alongside the connector that uses them, never before.
# Qdrant and PostgreSQL are here because `QdrantIndex` and `PostgresBeliefStore`
# open sockets to them. Memgraph is still absent: the graph is rebuilt from the
# registry in memory, so declaring it would be config that rots and a
# `compose up` that fails for reasons unrelated to CME.
#
# Both are opt-in profiles, because CME's defaults need no server at all:
#
#   docker compose up                          # CME alone, SQLite + lexical
#   docker compose --profile vector up         # + Qdrant
#   docker compose --profile postgres up       # + PostgreSQL

services:
  cme:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    environment:
      CME_DATABASE: /data/cme.sqlite
      CME_SOLVER: annealing
    volumes:
      - cme-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  postgres:
    profiles: ["postgres"]
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: cme
      POSTGRES_DB: cme
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  qdrant:
    profiles: ["vector"]
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    restart: unless-stopped

volumes:
  cme-data:
  qdrant-data:
  postgres-data:
