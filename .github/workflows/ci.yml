name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Test
        run: pytest -q

  postgres:
    # The store contract, run against a real PostgreSQL. The same tests cover
    # SQLite, so the two backends cannot drift apart unnoticed.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: cme
          POSTGRES_DB: cme
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt "psycopg[binary]"

      - name: Test against PostgreSQL
        env:
          DATABASE_URL: postgresql://postgres:cme@localhost:5432/cme
        run: |
          pytest tests/python_tests/test_store.py -q
          # These skip without DATABASE_URL, so prove they actually ran.
          pytest tests/python_tests/test_store.py -q --collect-only | grep -q "postgres"

  qdrant:
    # Against a real Qdrant, not a mock — a mock would only prove it agrees
    # with itself. This also checks the remote index ranks identically to the
    # in-memory one, which is what makes it a drop-in.
    runs-on: ubuntu-latest
    services:
      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt qdrant-client

      - name: Wait for Qdrant
        run: |
          for _ in $(seq 1 30); do
            if curl -fs localhost:6333/readyz; then exit 0; fi
            sleep 2
          done
          echo "qdrant never became ready"
          exit 1

      - name: Test against Qdrant
        env:
          QDRANT_URL: http://localhost:6333
        run: |
          pytest tests/python_tests/test_qdrant.py -q
          # Guard against the suite silently skipping: if the server is up,
          # these tests must actually run.
          pytest tests/python_tests/test_qdrant.py -q --collect-only | grep -q "test_add_and_search"

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cme-core

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cme-core

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

  parity:
    # The Rust core is only worth having if it agrees with the Python
    # reference. Build the wheel, install it, and run the shared assertions
    # against both implementations.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cme-core

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt maturin

      - name: Build and install cme_core
        run: |
          maturin build --release --features extension-module --out dist --manifest-path cme-core/Cargo.toml
          pip install dist/*.whl

      - name: Parity tests against the native graph
        run: |
          python -c "import cme_core; print('cme_core loaded')"
          pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -f docker/Dockerfile -t cme:ci .

      - name: Boot it and hit /health
        run: |
          docker run -d --name cme -p 8000:8000 cme:ci
          for _ in $(seq 1 30); do
            if curl -fs localhost:8000/health; then exit 0; fi
            sleep 1
          done
          echo "server never became healthy"
          docker logs cme
          exit 1
