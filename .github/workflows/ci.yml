name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Test
        run: pytest -q

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cme-core

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cme-core

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

  parity:
    # The Rust core is only worth having if it agrees with the Python
    # reference. Build the wheel, install it, and run the shared assertions
    # against both implementations.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cme-core

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt maturin

      - name: Build and install cme_core
        run: |
          maturin build --release --features extension-module --out dist --manifest-path cme-core/Cargo.toml
          pip install dist/*.whl

      - name: Parity tests against the native graph
        run: |
          python -c "import cme_core; print('cme_core loaded')"
          pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -f docker/Dockerfile -t cme:ci .

      - name: Boot it and hit /health
        run: |
          docker run -d --name cme -p 8000:8000 cme:ci
          for _ in $(seq 1 30); do
            if curl -fs localhost:8000/health; then exit 0; fi
            sleep 1
          done
          echo "server never became healthy"
          docker logs cme
          exit 1
